<text x="748" y="1148" text-anchor="middle" font-size="23" font-weight="bold">FINALIZED Receipt</text>
<rect x="52" y="1198" width="400" height="56" rx="12" fill="#FFFFFF" stroke="#B94C35" stroke-width="2"/>
<text x="252" y="1233" text-anchor="middle" font-size="23" font-weight="bold">Host application / invocation</text>
<rect x="52" y="1283" width="400" height="56" rx="12" fill="#FFF0C7" stroke="#956300" stroke-width="2"/>
<text x="252" y="1318" text-anchor="middle" font-size="23" font-weight="bold">ExecutionAttempt</text>
<text x="50" y="1430" font-size="20">Empty Execution Needs: skip Provider discovery and decisions.</text>
<text x="50" y="1466" font-size="20">FINALIZED can be PARTIAL. Selection never proves execution success.</text>
