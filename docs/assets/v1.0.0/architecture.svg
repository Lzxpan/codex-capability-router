<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title desc">
<title id="title">Codex Capability Router 1.0.0 architecture</title>
<desc id="desc">User Task to Host TaskAnalysis, trusted discovery, digest batches, Host Skill decisions, Skill handoff and Coverage Check, Execution Needs, Provider decisions, route(), FINALIZED Receipt, Host execution and ExecutionAttempt. Host LLM owns semantic decisions. Python Router owns deterministic validation and evidence. Empty Execution Needs skip Providers.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#18384A" stroke-width="1.5"/></marker></defs>
