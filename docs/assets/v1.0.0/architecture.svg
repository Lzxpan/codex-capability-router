<g font-family="Verdana, sans-serif" fill="#18384A">
<text x="42" y="54" font-size="28" font-weight="bold">A clear plan. Separate execution evidence.</text>
<rect x="30" y="86" width="445" height="1302" rx="22" fill="#FFE8DD"/>
<rect x="525" y="86" width="445" height="1302" rx="22" fill="#DCF3EC"/>
