<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">Supporting 三種正式結果</title>
  <desc id="desc">not_required、selected、no_matching_supporting_capability 三種狀態。</desc>
  <rect width="1100" height="540" fill="#f8fafc"/>
  <style>.a{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:16}.b{fill:#eef2ff;stroke:#4338ca;stroke-width:2;rx:16}.c{fill:#fff1f2;stroke:#be123c;stroke-width:2;rx:16}.h{font-family:'Segoe UI','Microsoft JhengHei','PingFang TC','Noto Sans TC','Noto Sans CJK TC',Arial,sans-serif;fill:#111827;font-size:27px;font-weight:700;text-anchor:middle}.t{font-family:'Segoe UI','Microsoft JhengHei','PingFang TC','Noto Sans TC','Noto Sans CJK TC',Arial,sans-serif;fill:#1f2937;font-size:20px;text-anchor:middle}.s{font-family:'Segoe UI','Microsoft JhengHei','PingFang TC','Noto Sans TC','Noto Sans CJK TC',Arial,sans-serif;fill:#475569;font-size:17px;text-anchor:middle}</style>
  <text x="550" y="45" class="h">Supporting status 只有三種</text>
  <rect x="45" y="90" width="310" height="350" class="a"/><text x="200" y="145" class="h">A</text><text x="200" y="190" class="t">execution_needs = []</text><text x="200" y="240" class="h">not_required</text><text x="200" y="292" class="s">Provider discovery：not_run</text><text x="200" y="320" class="s">digest：not_run</text><text x="200" y="348" class="s">counts：0</text><text x="200" y="397" class="s">例：純程式分析</text>
  <rect x="395" y="90" width="310" height="350" class="b"/><text x="550" y="145" class="h">B</text><text x="550" y="190" class="t">needs 非空</text><text x="550" y="240" class="h">selected</text><text x="550" y="292" class="s">至少選到 1 個 Provider</text><text x="550" y="320" class="s">仍可存在 unmet_execution_needs</text><text x="550" y="348" class="s">不新增 partial status</text><text x="550" y="397" class="s">例：node_repl</text>
  <rect x="745" y="90" width="310" height="350" class="c"/><text x="900" y="145" class="h">C</text><text x="900" y="190" class="t">needs 非空</text><text x="900" y="240" class="h">no_matching_</text><text x="900" y="270" class="h">supporting_capability</text><text x="900" y="322" class="s">Provider = 0</text><text x="900" y="350" class="s">所有 needs 列為 unmet</text><text x="900" y="397" class="s">例：影像編輯</text>
</svg>
