<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-labelledby="title desc">
  <title id="title">functions.exec_command 正向選取流程</title>
  <desc id="desc">本輪實測的唯讀 repository inspection 工作流程。</desc>
  <rect width="1180" height="430" fill="#f8fafc"/>
  <style>.b{fill:#fff;stroke:#334155;stroke-width:2;rx:14}.p{fill:#eef2ff;stroke:#4338ca;stroke-width:2;rx:14}.f{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:14}.t{font-family:'Segoe UI','Microsoft JhengHei','PingFang TC','Noto Sans TC','Noto Sans CJK TC',Arial,sans-serif;fill:#111827;font-size:20px;text-anchor:middle}.s{font-family:'Segoe UI','Microsoft JhengHei','PingFang TC','Noto Sans TC','Noto Sans CJK TC',Arial,sans-serif;fill:#475569;font-size:16px;text-anchor:middle}.l{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#64748b"/></marker></defs>
  <text x="590" y="38" class="t" font-size="28">本輪實測：read-only repository inspection</text>
  <rect x="25" y="90" width="200" height="90" class="b"/><text x="125" y="125" class="t">自然需求</text><text x="125" y="153" class="s">確認目前是 Git work tree</text>
  <rect x="255" y="90" width="200" height="90" class="b"/><text x="355" y="125" class="t">Execution Need</text><text x="355" y="153" class="s">唯讀 shell inspection</text>
  <rect x="485" y="90" width="200" height="90" class="p"/><text x="585" y="125" class="t">Provider digest</text><text x="585" y="153" class="s">builtin_tool / exact ID</text>
  <rect x="715" y="90" width="200" height="90" class="p"/><text x="815" y="125" class="t">LLM selection</text><text x="815" y="153" class="s">語意適用性判斷</text>
  <rect x="945" y="90" width="205" height="90" class="f"/><text x="1047" y="125" class="t">route() Receipt</text><text x="1047" y="153" class="s">selected / FINALIZED</text>
  <path d="M225 135 H255 M455 135 H485 M685 135 H715 M915 135 H945" class="l"/>
  <rect x="160" y="260" width="860" height="90" class="f"/><text x="590" y="298" class="t">實際唯讀 invocation：work-tree check → true</text><text x="590" y="326" class="s">不修改 repository；準備階段只驗證 Host declaration 與 fingerprint。</text>
</svg>
