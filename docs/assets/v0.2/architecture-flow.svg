<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">v0.2 Router 完整流程</title>
  <desc id="desc">Execution Needs 先經過 needs empty decision，再按結果進入 not_required 或 Supporting Provider。</desc>
  <rect width="1200" height="840" fill="#f7fafc"/>
  <style>
    .box{fill:#fff;stroke:#1f2937;stroke-width:2;rx:14}
    .decision{fill:#fff7ed;stroke:#c2410c;stroke-width:2}
    .support{fill:#eef2ff;stroke:#4338ca;stroke-width:2;rx:14}
    .final{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:14}
    .t{font-family:'Segoe UI','Microsoft JhengHei','PingFang TC','Noto Sans TC','Noto Sans CJK TC',Arial,sans-serif;fill:#111827;font-size:23px;text-anchor:middle}
    .s{font-family:'Segoe UI','Microsoft JhengHei','PingFang TC','Noto Sans TC','Noto Sans CJK TC',Arial,sans-serif;fill:#374151;font-size:17px;text-anchor:middle}
    .label{font-family:'Segoe UI','Microsoft JhengHei','PingFang TC','Noto Sans TC','Noto Sans CJK TC',Arial,sans-serif;fill:#7c2d12;font-size:17px;font-weight:700;text-anchor:middle}
    .line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker></defs>
  <text x="600" y="42" class="t" font-size="30">v0.2：先理解工作，再按需找可執行能力</text>
  <rect x="470" y="70" width="260" height="55" class="box"/><text x="600" y="105" class="t">User Request</text>
  <path d="M600 125 V145" class="line"/>
  <rect x="430" y="145" width="340" height="65" class="box"/><text x="600" y="177" class="t">TaskAnalysis</text><text x="600" y="200" class="s">工作、成品、限制、品質</text>
  <path d="M600 210 V230" class="line"/>
  <rect x="430" y="230" width="340" height="65" class="box"/><text x="600" y="262" class="t">Skill Selection</text><text x="600" y="285" class="s">方法與專業流程</text>
  <path d="M600 295 V315" class="line"/>
  <rect x="430" y="315" width="340" height="65" class="box"/><text x="600" y="347" class="t">Full Handoff</text><text x="600" y="370" class="s">完整 SKILL.md + applicability</text>
  <path d="M600 380 V400" class="line"/>
  <rect x="430" y="400" width="340" height="65" class="box"/><text x="600" y="432" class="t">Execution Needs</text><text x="600" y="455" class="s">是否需要外部執行能力？</text>
  <path d="M600 465 V505" class="line"/>
  <polygon points="600,505 770,565 600,625 430,565" class="decision"/><text x="600" y="559" class="t">needs empty?</text><text x="600" y="584" class="s">由 LLM 判斷</text>
  <path d="M430 565 H220 V640" class="line"/><path d="M770 565 H980 V640" class="line"/>
  <text x="325" y="550" class="label">YES / empty</text><text x="875" y="550" class="label">NO / non-empty</text>
  <rect x="70" y="640" width="300" height="90" class="final"/><text x="220" y="677" class="t">not_required</text><text x="220" y="706" class="s">不啟動 Provider discovery</text>
  <rect x="830" y="640" width="300" height="90" class="support"/><text x="980" y="677" class="t">Supporting Provider</text><text x="980" y="706" class="s">lazy discovery → digest → LLM</text>
  <path d="M220 730 V750 H600" class="line"/><path d="M980 730 V750 H600" class="line"/><path d="M600 750 V775" class="line"/>
  <rect x="430" y="775" width="340" height="55" class="final"/><text x="600" y="810" class="t">route() → Receipt → FINALIZED</text>
</svg>
